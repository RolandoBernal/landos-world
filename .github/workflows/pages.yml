name: Deploy Lando's World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the production commit
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic release label
        id: release
        env:
          BUILD_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_DATE="$(git show -s --format=%cI "$BUILD_SHA")"
          RELEASE_DATE="$(date -u --date="$COMMIT_DATE" +'%Y-%m-%d')"
          echo "built_at=$DEPLOYED_AT" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_DATE-$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build deployment artifact and release metadata
        env:
          LANDOS_BUILD_SHA: ${{ github.sha }}
          LANDOS_RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          LANDOS_BUILT_AT: ${{ steps.release.outputs.built_at }}
          LANDOS_DEPLOYMENT_RUN: ${{ github.run_number }}
        run: node scripts/build-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
